<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFO · protótipos da interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&family=Inter+Tight:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000}
button{font:inherit}
.app{position:fixed;inset:0;overflow:hidden}
.panel{display:none}
[data-section=fone] [data-panel=fone],[data-section=mic] [data-panel=mic],[data-section=eq] [data-panel=eq]{display:block}
.splash{position:absolute;inset:0;z-index:50;display:grid;place-items:center;cursor:pointer;transition:opacity .35s ease-out,visibility .35s}
.app[data-ready] .splash{opacity:0;visibility:hidden;pointer-events:none}
.curve{display:block;width:100%}
.curve-line{fill:none;vector-effect:non-scaling-stroke}
.curve-zero{vector-effect:non-scaling-stroke}
.band{display:flex;flex-direction:column;align-items:center;gap:6px}
.band input{writing-mode:vertical-lr;direction:rtl;width:24px;margin:0}
[data-eq=off] .curve{opacity:.3}
.tog{display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;text-align:left;cursor:pointer;border:0;background:none;color:inherit}
.tog:disabled,.seg button:disabled{opacity:.35;cursor:default}
.tog-knob{position:relative;flex:none}
.tog-knob::after{content:"";position:absolute}
.rng{display:grid;align-items:center}
.rng output{text-align:right}
input[type=range]{width:100%;cursor:pointer}
input[type=range]:disabled{opacity:.35;cursor:default}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes bob{to{transform:translateY(-8px)}}

/* Splash shared by every variant: a "UFO" calligram cow grazes on a tiny horizon and gets abducted. */
.splash{background:#000}
.scene{position:relative;width:360px;height:300px}
.horizon{position:absolute;left:0;right:0;top:250px;height:1px;background:rgba(255,255,255,.3);transform-origin:center;animation:horizonIn .7s cubic-bezier(.23,1,.32,1) both}
.ground{position:absolute;left:30px;top:243px;width:300px;animation:cowIn .5s ease-out .15s both}
.ground svg,.grass svg{display:block;width:100%;overflow:visible}
.grass{position:absolute;left:206px;top:226px;width:44px;transform-origin:bottom;animation:cowIn .4s ease-out .3s both,eaten 1.8s steps(3,end) .7s forwards}
.cow{position:absolute;left:65px;top:116px;width:230px;animation:cowIn .4s ease-out .2s both,abduct 1s cubic-bezier(.45,0,.55,1) 2.45s forwards}
.cow-body{transform-origin:62% 100%;animation:graze .45s ease-in-out .55s 4 alternate}
.cow svg{display:block;width:100%;overflow:visible}
.cow path{fill:#EDEDEA}
.saucer{position:absolute;left:115px;top:8px;width:130px;animation:saucerIn 1s cubic-bezier(.23,1,.32,1) 1.25s both,saucerOut .6s cubic-bezier(.55,0,1,.45) 3.55s forwards}
.saucer svg{display:block;animation:bob 1.1s ease-in-out 2.2s infinite alternate}
.tractor{position:absolute;left:120px;top:62px;width:120px;height:188px;background:linear-gradient(to bottom,var(--beam),transparent);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);transform-origin:top;animation:tractor 1.45s ease-out 2.1s both}
@keyframes horizonIn{from{transform:scaleX(0)}}
@keyframes cowIn{from{opacity:0}}
@keyframes graze{to{transform:rotate(4deg)}}
@keyframes eaten{to{transform:scaleY(.35)}}
@keyframes abduct{0%{transform:none}20%{transform:translateY(-6px) rotate(-4deg)}85%{opacity:1}100%{transform:translateY(-140px) scale(.25) rotate(8deg);opacity:0}}
@keyframes saucerIn{from{opacity:0;transform:translate(240px,-160px) rotate(14deg)}}
@keyframes saucerOut{to{transform:translate(-300px,-220px) scale(.55) rotate(-10deg);opacity:0}}
@keyframes tractor{0%{transform:scaleY(0);opacity:0}18%{transform:none;opacity:1}86%{opacity:1}100%{opacity:0}}
@keyframes blink{50%{opacity:.25}}
.ufo-light{animation:blink 1.2s ease-in-out infinite}
.ufo-light:nth-child(2n){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}

/* ───────── 1 · RADAR ───────── */
.v-radar{--bg:#060A0F;--panel:#0C131B;--line:#18232F;--tx:#DCE7F2;--mu:#6F8091;--ac:#5CFFB0;--acd:rgba(92,255,176,.12);
  display:grid;grid-template-columns:88px 1fr;color:var(--tx);font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  background:var(--bg) radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.5px) 0 0/22px 22px}
.v-radar .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.v-radar .rail{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 0;border-right:1px solid var(--line);background:rgba(6,10,15,.85)}
.v-radar .rail .logo{width:46px;margin-bottom:22px}
.v-radar .nav{width:62px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:14px;background:none;color:var(--mu);cursor:pointer;transition:color .15s ease-out,background-color .15s ease-out,border-color .15s ease-out}
.v-radar .nav span{font:600 9.5px "JetBrains Mono",monospace;letter-spacing:.12em}
.v-radar .nav:hover{color:var(--tx)}
.v-radar .nav:active{transform:scale(.96)}
.v-radar[data-section=fone] [data-nav=fone],.v-radar[data-section=mic] [data-nav=mic],.v-radar[data-section=eq] [data-nav=eq]{color:var(--ac);background:var(--acd);border-color:rgba(92,255,176,.28)}
.v-radar .rail-batt{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px}
.v-radar .rail-batt i{display:block;width:10px;height:58px;border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
.v-radar .rail-batt i::after{content:"";position:absolute;left:1px;right:1px;bottom:1px;height:calc(var(--b) * 1%);background:var(--ac);border-radius:2px}
.v-radar .main{overflow:auto;padding:30px 44px 120px}
.v-radar .top{display:flex;justify-content:space-between;align-items:center;max-width:940px;margin-bottom:8px}
.v-radar .link{display:flex;align-items:center;gap:8px}
.v-radar .link b{width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 4px var(--acd)}
.v-radar .panel{max-width:940px}
.v-radar .app-in{opacity:0}
.v-radar[data-ready] .app-in{opacity:1;animation:radarIn .45s cubic-bezier(.23,1,.32,1) both}
.v-radar[data-ready] .panel{animation:radarIn .26s cubic-bezier(.23,1,.32,1)}
@keyframes radarIn{from{opacity:0;transform:translateY(10px)}}
.v-radar h1{font-size:36px;font-weight:600;letter-spacing:-.02em;margin:6px 0 24px}
.v-radar .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.v-radar .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.v-radar .card::before,.v-radar .card::after{content:"";position:absolute;width:10px;height:10px;border-color:var(--ac);border-style:solid;opacity:.6}
.v-radar .card::before{top:-1px;left:-1px;border-width:1px 0 0 1px;border-top-left-radius:12px}
.v-radar .card::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0;border-bottom-right-radius:12px}
.v-radar .card-k{margin-bottom:14px}
.v-radar .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:#080D13;border:1px solid var(--line);border-radius:10px}
.v-radar .seg button{border:0;background:none;color:var(--mu);font-size:13px;padding:9px 0;border-radius:7px;cursor:pointer;transition:color .15s ease-out,background-color .15s ease-out}
.v-radar .seg button[data-active]{background:var(--acd);color:var(--ac);box-shadow:inset 0 0 0 1px rgba(92,255,176,.3)}
.v-radar .tog{padding:14px 0;border-top:1px solid var(--line);font-size:14px}
.v-radar .tog small{display:block;color:var(--mu);font-size:12px;margin-top:3px}
.v-radar .tog-knob{width:40px;height:22px;border-radius:999px;background:#1A2633;transition:background-color .2s ease-out}
.v-radar .tog-knob::after{top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--mu);transition:transform .2s cubic-bezier(.23,1,.32,1),background-color .2s ease-out}
.v-radar .tog[aria-pressed=true] .tog-knob{background:var(--acd)}
.v-radar .tog[aria-pressed=true] .tog-knob::after{transform:translateX(18px);background:var(--ac)}
.v-radar .rng{grid-template-columns:120px 1fr 52px;gap:14px;padding:12px 0;color:var(--mu);font-size:13px}
.v-radar .rng output{color:var(--tx);font-family:"JetBrains Mono",monospace;font-size:12px}
.v-radar input[type=range]{accent-color:var(--ac)}
.v-radar .stat{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--mu)}
.v-radar .stat b{color:var(--tx);font-weight:500}
.v-radar .eq-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.v-radar .eq-head .tog{width:auto;border:0;padding:0}
.v-radar .chips{display:flex;gap:6px;flex-wrap:wrap}
.v-radar .chip{border:1px solid var(--line);background:none;color:var(--mu);padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer;transition:color .15s ease-out,border-color .15s ease-out}
.v-radar .chip[data-active]{color:var(--ac);border-color:var(--ac)}
.v-radar .curve{height:150px;margin:18px 0}
.v-radar .curve-line{stroke:var(--ac);stroke-width:2}
.v-radar .curve-fill{fill:var(--acd)}
.v-radar .curve-zero{stroke:var(--line)}
.v-radar .bands{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.v-radar .band{font:500 11px "JetBrains Mono",monospace;color:var(--mu)}
.v-radar .band input{height:150px;accent-color:var(--ac)}
.v-radar .band output{color:var(--tx)}

/* ───────── 2 · ABDUÇÃO ───────── */
.v-abduct{--bg:#160B2E;--card:#22143F;--line:#3A2763;--tx:#F6F0FF;--mu:#A99BC9;--ac:#C6FF3D;--ink:#160B2E;--pink:#FF7AD9;
  display:flex;flex-direction:column;color:var(--tx);font-family:"Space Grotesk",system-ui,sans-serif;
  background:var(--bg) radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.6px) 0 0/140px 110px}
.v-abduct .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 32px}
.v-abduct .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:24px;letter-spacing:-.03em}
.v-abduct .brand svg{width:46px}
.v-abduct .tabs{position:relative;display:grid;grid-template-columns:repeat(3,128px);padding:5px;border-radius:999px;background:var(--card)}
.v-abduct .tab{position:relative;z-index:1;height:44px;border:0;border-radius:999px;background:none;color:var(--mu);font-weight:600;font-size:15px;cursor:pointer;transition:color .2s ease-out}
.v-abduct .tab:active{transform:scale(.97)}
.v-abduct .blob{position:absolute;top:5px;left:5px;width:128px;height:44px;border-radius:999px;background:var(--ac);transition:transform .38s cubic-bezier(.34,1.56,.64,1)}
.v-abduct .blob svg{position:absolute;left:50%;top:-24px;width:38px;margin-left:-19px}
.v-abduct[data-section=mic] .blob{transform:translateX(128px)}
.v-abduct[data-section=eq] .blob{transform:translateX(256px)}
.v-abduct[data-section=fone] [data-nav=fone],.v-abduct[data-section=mic] [data-nav=mic],.v-abduct[data-section=eq] [data-nav=eq]{color:var(--ink)}
.v-abduct .batt{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:var(--card);font-weight:600}
.v-abduct .batt i{width:30px;height:14px;border:2px solid var(--tx);border-radius:4px;position:relative}
.v-abduct .batt i::after{content:"";position:absolute;inset:1px;right:auto;width:calc(var(--b) * .22px);background:var(--ac);border-radius:1px}
.v-abduct main{flex:1;overflow:auto;padding:8px 32px 130px;display:flex;justify-content:center}
.v-abduct .panel{width:min(900px,100%)}
.v-abduct .app-in{opacity:0}
.v-abduct[data-ready] .app-in{opacity:1;animation:abductIn .5s cubic-bezier(.23,1,.32,1) both}
.v-abduct[data-ready] .panel{animation:abductIn .32s cubic-bezier(.23,1,.32,1)}
@keyframes abductIn{from{opacity:0;transform:translateY(18px)}}
.v-abduct h1{font-size:clamp(44px,7vw,72px);line-height:.95;font-weight:700;letter-spacing:-.045em;margin:20px 0 30px}
.v-abduct h1 em{font-style:normal;color:var(--ac)}
.v-abduct .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.v-abduct .card{background:var(--card);border-radius:26px;padding:22px 24px}
.v-abduct .card-k{font-size:13px;font-weight:600;color:var(--pink);margin-bottom:14px}
.v-abduct .seg{display:flex;gap:8px}
.v-abduct .seg button{flex:1;height:52px;border:2px solid var(--line);border-radius:16px;background:none;color:var(--tx);font-weight:600;cursor:pointer;transition:background-color .18s ease-out,border-color .18s ease-out,color .18s ease-out}
.v-abduct .seg button:active{transform:scale(.97)}
.v-abduct .seg button[data-active]{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.v-abduct .tog{padding:14px 0;font-size:17px;font-weight:600}
.v-abduct .tog small{display:block;font-size:13px;font-weight:500;color:var(--mu);margin-top:2px}
.v-abduct .tog-knob{width:58px;height:34px;border-radius:999px;background:var(--line);transition:background-color .2s ease-out}
.v-abduct .tog-knob::after{top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--tx);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.v-abduct .tog[aria-pressed=true] .tog-knob{background:var(--ac)}
.v-abduct .tog[aria-pressed=true] .tog-knob::after{transform:translateX(24px);background:var(--ink)}
.v-abduct .rng{grid-template-columns:1fr 60px;gap:10px 14px;padding:12px 0;font-weight:600}
.v-abduct .rng span{grid-column:1/-1;color:var(--mu);font-size:13px}
.v-abduct .rng output{font-size:22px;color:var(--ac)}
.v-abduct input[type=range]{accent-color:var(--ac);height:28px}
.v-abduct .stat{display:flex;justify-content:space-between;padding:10px 0;color:var(--mu);font-weight:500}
.v-abduct .stat b{color:var(--tx)}
.v-abduct .eq-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.v-abduct .eq-head .tog{width:auto;padding:0}
.v-abduct .chips{display:flex;gap:8px;flex-wrap:wrap}
.v-abduct .chip{border:0;background:var(--line);color:var(--tx);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;transition:background-color .18s ease-out,color .18s ease-out}
.v-abduct .chip:active{transform:scale(.96)}
.v-abduct .chip[data-active]{background:var(--pink);color:var(--ink)}
.v-abduct .curve{height:170px;margin:20px 0}
.v-abduct .curve-line{stroke:var(--ac);stroke-width:3}
.v-abduct .curve-fill{fill:rgba(198,255,61,.14)}
.v-abduct .curve-zero{stroke:var(--line);stroke-dasharray:4 6}
.v-abduct .bands{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.v-abduct .band{font-weight:600;font-size:12px;color:var(--mu)}
.v-abduct .band input{height:160px;accent-color:var(--pink)}
.v-abduct .band output{color:var(--pink)}

/* ───────── 3 · ÓRBITA ───────── */
.v-orbit{--bg:#0B0B0C;--tx:#EDEDEA;--mu:#77776F;--line:#232322;--ac:#FF5A1F;--r:0deg;
  display:grid;grid-template-columns:minmax(320px,40%) 1fr;color:var(--tx);font-family:"Inter Tight",system-ui,sans-serif;background:var(--bg)}
.v-orbit[data-section=mic]{--r:-120deg}
.v-orbit[data-section=eq]{--r:-240deg}
.v-orbit .mono{font-family:"DM Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.06em;color:var(--mu)}
.v-orbit .side{position:relative;display:grid;place-items:center;border-right:1px solid var(--line)}
.v-orbit .orbit{position:relative;width:310px;height:310px}
.v-orbit .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed #34342F;transform:rotate(var(--r));transition:transform .55s cubic-bezier(.23,1,.32,1)}
.v-orbit .moon{position:absolute;top:50%;left:50%;width:0;height:0;transform:rotate(var(--a)) translateX(155px)}
.v-orbit .moon-body{position:absolute;display:flex;flex-direction:column;align-items:center;gap:8px;transform:translate(-50%,-50%) rotate(calc(-1 * (var(--a) + var(--r))));transition:transform .55s cubic-bezier(.23,1,.32,1)}
.v-orbit .moon button{width:62px;height:62px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--mu);cursor:pointer;transition:background-color .2s ease-out,color .2s ease-out,border-color .2s ease-out}
.v-orbit .moon button:hover{color:var(--tx);border-color:#3a3a36}
.v-orbit .moon button:active{transform:scale(.95)}
.v-orbit .moon .mono{position:absolute;top:70px;white-space:nowrap}
.v-orbit[data-section=fone] [data-nav=fone],.v-orbit[data-section=mic] [data-nav=mic],.v-orbit[data-section=eq] [data-nav=eq]{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.v-orbit .core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.v-orbit .core svg{width:118px}
.v-orbit .core .pct{font:500 28px "DM Mono",monospace;letter-spacing:-.02em}
.v-orbit .moon{opacity:0}
.v-orbit[data-ready] .moon{animation:moonIn .4s cubic-bezier(.23,1,.32,1) both}
.v-orbit[data-ready] .moon:nth-of-type(2){animation-delay:.07s}
.v-orbit[data-ready] .moon:nth-of-type(3){animation-delay:.14s}
@keyframes moonIn{from{opacity:0}to{opacity:1}}
.v-orbit .main{overflow:auto;padding:64px 64px 130px}
.v-orbit .panel{max-width:620px}
.v-orbit[data-ready] .panel{animation:orbitIn .3s cubic-bezier(.23,1,.32,1)}
@keyframes orbitIn{from{opacity:0;transform:translateX(14px)}}
.v-orbit h1{display:flex;align-items:center;gap:12px;font-size:44px;font-weight:500;letter-spacing:-.035em;margin:0 0 40px}
.v-orbit h1::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ac)}
.v-orbit .card{padding:22px 0;border-top:1px solid var(--line)}
.v-orbit .card-k{font:400 11px "DM Mono",monospace;letter-spacing:.06em;color:var(--mu);margin-bottom:16px}
.v-orbit .seg{display:flex;gap:26px}
.v-orbit .seg button{padding:4px 0;border:0;border-bottom:2px solid transparent;background:none;color:var(--mu);font-size:19px;cursor:pointer;transition:color .15s ease-out,border-color .15s ease-out}
.v-orbit .seg button[data-active]{color:var(--tx);border-color:var(--ac)}
.v-orbit .tog{padding:12px 0;font-size:16px}
.v-orbit .tog small{display:block;color:var(--mu);font-size:13px;margin-top:2px}
.v-orbit .tog-knob{width:34px;height:18px;border:1px solid #3a3a36;border-radius:4px;transition:border-color .2s ease-out}
.v-orbit .tog-knob::after{top:3px;left:3px;width:10px;height:10px;border-radius:2px;background:var(--mu);transition:transform .2s cubic-bezier(.23,1,.32,1),background-color .2s ease-out}
.v-orbit .tog[aria-pressed=true] .tog-knob{border-color:var(--ac)}
.v-orbit .tog[aria-pressed=true] .tog-knob::after{transform:translateX(16px);background:var(--ac)}
.v-orbit .rng{grid-template-columns:110px 1fr 48px;gap:16px;padding:10px 0;color:var(--mu);font-size:14px}
.v-orbit .rng output{font:500 14px "DM Mono",monospace;color:var(--tx)}
.v-orbit input[type=range]{accent-color:var(--ac)}
.v-orbit .stat{display:flex;justify-content:space-between;padding:8px 0;color:var(--mu);font-size:14px}
.v-orbit .stat b{color:var(--tx);font-weight:500}
.v-orbit .eq-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.v-orbit .eq-head .tog{width:auto;padding:0}
.v-orbit .chips{display:flex;gap:18px;flex-wrap:wrap}
.v-orbit .chip{padding:2px 0;border:0;background:none;color:var(--mu);font-size:14px;cursor:pointer;transition:color .15s ease-out}
.v-orbit .chip[data-active]{color:var(--ac)}
.v-orbit .curve{height:140px;margin:24px 0}
.v-orbit .curve-line{stroke:var(--tx);stroke-width:1.5}
.v-orbit .curve-fill{fill:rgba(255,90,31,.10)}

function responseDb(frequency) {
  if (!state.eqOn) return 0;
  let total = -Math.max(0, ...state.bands);
  const w = 2 * Math.PI * frequency / 48000;
  FREQS.forEach((f0, i) => {
    const A = Math.pow(10, state.bands[i] / 40), w0 = 2 * Math.PI * f0 / 48000;

      const re = b0 + b1 * Math.cos(w) + b2 * Math.cos(2 * w);
      const im = -(b1 * Math.sin(w) + b2 * Math.sin(2 * w));
      return re * re + im * im;
    };
    total += 10 * Math.log10(mag(1 + alpha * A, -2 * c, 1 - alpha * A) / mag(1 + alpha / A, -2 * c, 1 - alpha / A));
  });
  return total;
}

  const points = [];
  for (let step = 0; step <= 120; step++) {
    const t = step / 120, f = 20 * Math.pow(1000, t);
    const g = Math.max(-12, Math.min(12, responseDb(f)));
    points.push([t * width, height / 2 - g / 12 * (height / 2 - 4)]);
  }
  return points;
}

// Splash: a small green plain with a grass tuft, the UFO-calligram cow nibbling it, then the abduction.
function splash(colors) {
  return `<div class="splash" title="Clique para pular" style="--beam:${colors.beam}">
    <div class="scene">
      <div class="horizon"></div>
      <div class="ground"><svg viewBox="0 0 300 16"><path d="M0 8C40 1 260 1 300 8C260 15 40 15 0 8Z" fill="#2F6B2A"/><path d="M14 7C60 2 240 2 286 7C240 9 60 9 14 7Z" fill="#4E9A3C"/></svg></div>
      <div class="tractor"></div>
      <div class="cow"><div class="cow-body"><svg viewBox="30 0 965 572" aria-label="UFO">
        <path id="u-shape" fill-rule="evenodd" d="${COW_PATHS.uShape}"/>
        <path id="f-shape" fill-rule="evenodd" d="${COW_PATHS.fShape}"/>
        <path id="o-head" fill-rule="evenodd" d="${COW_PATHS.oHead}"/>
      </svg></div></div>
      <div class="grass"><svg viewBox="0 0 44 26"><g fill="#6CC24A"><path d="M6 26C6 16 4 10 0 4C8 9 11 16 12 26Z"/><path d="M13 26C14 14 16 6 21 0C20 9 19 17 20 26Z"/><path d="M21 26C22 16 26 9 33 5C28 12 27 18 27 26Z"/><path d="M28 26C30 19 35 14 44 12C37 17 34 21 34 26Z"/></g></svg></div>
      <div class="saucer">${ufo(colors.ufo)}</div>
    </div>
  </div>`;
}
const seg = (key, options) => `<div class="seg">${options.map(([value, label]) => `<button data-choice="${key}" data-value="${value}">${label}</button>`).join('')}</div>`;
const tog = (key, label, sub = '') => `<button class="tog" data-toggle="${key}" aria-pressed="false"><span>${label}${sub ? `<small>${sub}</small>` : ''}</span><span class="tog-knob"></span></button>`;
const rng = (key, label, min, max, step, format = 'plain') => `<label class="rng"><span>${label}</span><input type="range" data-key="${key}" min="${min}" max="${max}" step="${step}"><output data-text="${key}" data-fmt="${format}"></output></label>`;
const stat = (label, value) => `<div class="stat"><span>${label}</span><b>${value}</b></div>`;

function panels(titles) {
  return `

      <div class="card">
        <div class="card-k mono">Aparelho</div>

  <section class="panel" data-panel="mic">

    <h1>${titles.eq}</h1>
    <div class="card">
      <div class="eq-head">
        <div class="chips">${[...Object.keys(PRESETS), 'Personalizado'].map((p) => `<button class="chip" data-preset="${p}">${p}</button>`).join('')}</div>
        ${tog('eqOn', 'Ativo')}
      </div>
      <svg class="curve" data-curve viewBox="0 0 400 120" preserveAspectRatio="none">
        <line class="curve-zero" x1="0" y1="60" x2="400" y2="60"/>
        <path class="curve-fill"/><path class="curve-line"/>
      </svg>
      <div class="bands">${FREQS.map((f, i) => `<div class="band"><output data-text="band:${i}" data-fmt="db"></output><input type="range" data-key="band:${i}" min="-12" max="12" step="0.5" aria-label="${f} Hz"><span>${f >= 1000 ? f / 1000 + 'k' : f}</span></div>`).join('')}</div>
    </div>
  </section>`;
}

function sync(root) {
  root.querySelectorAll('[data-text]').forEach((el) => { el.textContent = FORMATS[el.dataset.fmt || 'plain'](getVal(el.dataset.text)); });
  root.querySelectorAll('input[data-key]').forEach((el) => { el.value = getVal(el.dataset.key); el.disabled = isDisabled(el.dataset.key); });
  root.querySelectorAll('[data-toggle]').forEach((el) => { el.setAttribute('aria-pressed', String(!!state[el.dataset.toggle])); el.disabled = isDisabled(el.dataset.toggle); });
  root.querySelectorAll('[data-choice]').forEach((el) => { el.toggleAttribute('data-active', String(state[el.dataset.choice]) === el.dataset.value); el.disabled = isDisabled(el.dataset.choice); });
  root.querySelectorAll('[data-preset]').forEach((el) => el.toggleAttribute('data-active', state.preset === el.dataset.preset));
  root.querySelectorAll('svg[data-curve]').forEach((svg) => {
    const pts = curvePoints(400, 120);
    const line = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join('');
    svg.querySelector('.curve-line').setAttribute('d', line);
    svg.querySelector('.curve-fill').setAttribute('d', `${line}L400,60L0,60Z`);
  });
  root.style.setProperty('--b', state.battery);
  root.dataset.eq = state.eqOn ? 'on' : 'off';
}

function init(root, variant) {
  root.addEventListener('input', (e) => {
    const key = e.target.dataset.key;
    if (!key) return;
    setVal(key, Number(e.target.value));
    sync(root);
  });
  root.addEventListener('click', (e) => {
    const target = e.target.closest('[data-toggle],[data-choice],[data-preset],[data-nav]');
    if (!target || target.disabled) return;
    if (target.dataset.toggle) state[target.dataset.toggle] = !state[target.dataset.toggle];
    else if (target.dataset.choice) {
      const raw = target.dataset.value;
      state[target.dataset.choice] = Number.isNaN(Number(raw)) ? raw : Number(raw);
    } else if (target.dataset.preset) {
      if (PRESETS[target.dataset.preset]) { state.bands = [...PRESETS[target.dataset.preset]]; state.preset = target.dataset.preset; }
    } else if (target.dataset.nav) root.dataset.section = target.dataset.nav;
    sync(root);
  });
  const finishSplash = () => { if (root.isConnected) root.setAttribute('data-ready', ''); };
  root.querySelector('.splash').addEventListener('click', finishSplash);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(finishSplash, reduce ? 200 : variant.splashMs);
  sync(root);
}

// ── Picker wiring (spec), mounting each variant with its behaviour ──
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => {
    stage.innerHTML = variants[i].render();
    init(stage.firstElementChild, variants[i]);
  });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
