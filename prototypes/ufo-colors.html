<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFO · cores do disco</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B0B0C;color:#EDEDEA;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
.page{position:fixed;inset:0;display:grid;grid-template-rows:40px 1fr}
.titlebar{display:flex;align-items:center;gap:10px;padding:0 16px;font:12px "Cascadia Mono",Consolas,monospace;color:#77776F}
.titlebar svg{width:22px}
.stage{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #1A1A19}
.splash{background:#000;display:grid;place-items:center;position:relative;overflow:hidden}
.splash .hero{width:min(380px,70%);position:relative;z-index:1}
.splash .beam{position:absolute;left:50%;top:calc(50% + 30px);width:300px;height:44%;margin-left:-150px;background:linear-gradient(to bottom,rgba(255,90,31,.45),rgba(255,90,31,0));clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
.splash .ground{position:absolute;bottom:12%;left:50%;width:420px;height:14px;margin-left:-210px;border-radius:50%;background:#2F6B2A}
.orbit{display:grid;place-items:center;border-left:1px solid #232322}
.ring{position:relative;width:310px;height:310px;border:1px dashed #34342F;border-radius:50%;display:grid;place-items:center}
.core{display:flex;flex-direction:column;align-items:center;gap:6px}
.core svg{width:118px}
.pct{font:500 28px "Cascadia Mono",Consolas,monospace}
.mono{font:11px "Cascadia Mono",Consolas,monospace;color:#77776F}
.moon{position:absolute;right:-31px;top:124px;width:62px;height:62px;border-radius:50%;background:#FF5A1F;display:grid;place-items:center;color:#0B0B0C}
.label{position:absolute;left:24px;bottom:72px;font:11px "Cascadia Mono",Consolas,monospace;color:#77776F;line-height:1.6}
.label b{color:#EDEDEA;font-weight:500}
.ufo-light{animation:blink 1.4s ease-in-out infinite}
.ufo-light:nth-child(2n){animation-delay:.5s}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.ufo-light{animation:none}}
@media (max-width:820px){.stage{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.orbit{border-left:0;border-top:1px solid #232322}}

/* picker (verbatim spec) */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,.85)}
.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
.proto-picker[data-position="top"]{bottom:auto;top:24px}
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Casco branco</button>
  <button class="proto-picker-item">Faixa laranja</button>
  <button class="proto-picker-item">Casco laranja</button>
</nav>

<script>
// Same saucer shape everywhere; only which layer gets orange or white changes.
// Layers: dome, dome highlight, hull (upper lens), band (lower lens), windows, hatch.
// The page colour draws the gaps between layers, so the line-art construction stays readable.
const ORANGE = '#FF5A1F', WHITE = '#EDEDEA';
let clipCount = 0;
function ufo(c, edge) {
  const clip = `lens-${++clipCount}`;
  const lens = 'M14 70C52 38 148 38 186 70C150 106 50 106 14 70Z';
  return `<svg viewBox="0 18 200 92" aria-hidden="true">
    <clipPath id="${clip}"><path d="${lens}"/></clipPath>
    <path d="M70 50a30 30 0 0 1 60 0" fill="${c.dome}" stroke="${edge}" stroke-width="7" stroke-linejoin="round"/>
    <path d="M84 36a17 17 0 0 1 11-12" fill="none" stroke="${c.shine}" stroke-width="7" stroke-linecap="round"/>
    <path d="${lens}" fill="${c.hull}"/>
    <path clip-path="url(#${clip})" d="M0 66H52v-5h8v5h10v-6h12v6H200V120H0Z" fill="${c.band}"/>
    <path d="${lens}" fill="none" stroke="${edge}" stroke-width="7" stroke-linejoin="round"/>
    <g fill="${c.light}"><rect class="ufo-light" x="42" y="74" width="13" height="5.5" rx="2.75" transform="rotate(12 48 77)"/><rect class="ufo-light" x="71" y="75" width="10" height="5.5" rx="2.75" transform="rotate(50 76 78)"/><circle class="ufo-light" cx="100" cy="78" r="4"/><rect class="ufo-light" x="119" y="75" width="10" height="5.5" rx="2.75" transform="rotate(-50 124 78)"/><rect class="ufo-light" x="145" y="74" width="13" height="5.5" rx="2.75" transform="rotate(-12 152 77)"/></g>
    <ellipse cx="100" cy="97" rx="28" ry="6.5" fill="${c.hatch}" stroke="${edge}" stroke-width="7"/>
  </svg>`;
}

const palettes = [
  { // White saucer, orange only on the dome, windows and hatch: the accent marks the "alive" parts.
    name: 'Casco branco',
    colors: { dome: ORANGE, shine: 'rgba(255,255,255,.8)', hull: WHITE, band: WHITE, light: ORANGE, hatch: ORANGE },
    notes: ['casco e faixa <b>branco</b>', 'cúpula, janelas e escotilha <b>laranja</b>'],
  },
  { // Two-tone hull: white top, orange lower band with white windows, glass dome in white.
    name: 'Faixa laranja',
    colors: { dome: WHITE, shine: ORANGE, hull: WHITE, band: ORANGE, light: WHITE, hatch: WHITE },
    notes: ['cúpula e casco <b>branco</b>', 'faixa <b>laranja</b> com janelas brancas'],
  },
  { // Inverted: orange body, white glass dome and white lower band carrying orange windows.
    name: 'Casco laranja',
    colors: { dome: WHITE, shine: ORANGE, hull: ORANGE, band: WHITE, light: ORANGE, hatch: ORANGE },
    notes: ['casco e escotilha <b>laranja</b>', 'cúpula e faixa <b>branco</b>, janelas laranja'],
  },
];

const variants = palettes.map((palette) => () => `
  <div class="page">
    <div class="titlebar">${ufo(palette.colors, '#0B0B0C')}ufo</div>
    <div class="stage">
      <div class="splash">
        <div class="beam"></div>
        <div class="ground"></div>
        <div class="hero">${ufo(palette.colors, '#000')}</div>
        <div class="label">${palette.notes.join('<br>')}</div>
      </div>
      <div class="orbit">
        <div class="ring">
          <div class="core">${ufo(palette.colors, '#0B0B0C')}<span class="pct">31%</span><span class="mono">aw pro · conectado</span></div>
          <div class="moon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="7" rx="1.6"/><rect x="16.5" y="14" width="4.5" height="7" rx="1.6"/></svg></div>
        </div>
      </div>
    </div>
  </div>`);

// Picker wiring (spec).
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
